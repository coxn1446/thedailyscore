# Cloud Build: one image + deploy thedailyscore-prod (DB_SCHEMA=prod).
#   gcloud config set project thedailyscore-528401 && npm run deploy:prod

substitutions:
  _CLOUD_RUN_REGION: us-central1
  _CLOUDSQL_PROJECT: nash-data
  _CLOUDSQL_REGION: northamerica-northeast1
  _CLOUDSQL_INSTANCE: shared-pg
  _DEFAULT_CLIENT_URL: https://thedailyscore.site

steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/thedailyscore', '.']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/thedailyscore']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - thedailyscore-prod
      - --image=gcr.io/$PROJECT_ID/thedailyscore
      - --region=$_CLOUD_RUN_REGION
      - --platform=managed
      - --allow-unauthenticated
      - --memory=256Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=2
      - --add-cloudsql-instances=$_CLOUDSQL_PROJECT:$_CLOUDSQL_REGION:$_CLOUDSQL_INSTANCE
      - --set-env-vars=GOOGLE_CLOUD_PROJECT=$PROJECT_ID,NODE_ENV=production,DB_SCHEMA=prod,DEFAULT_CLIENT_URL=$_DEFAULT_CLIENT_URL
    id: deploy-prod

images:
  - 'gcr.io/$PROJECT_ID/thedailyscore'
