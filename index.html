<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://accounts.google.com https://appleid.cdn-apple.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' http://localhost:8080 ws://localhost:3000 ws://localhost:8080 wss://localhost:3000 https://accounts.google.com https://appleid.apple.com; worker-src 'self' blob:; frame-src https://accounts.google.com https://appleid.apple.com; object-src 'none'; base-uri 'self';"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FBF9F5" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="The Daily Score — the social broadsheet of daily games." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>The Daily Score</title>
  </head>
  <body>
    <div id="root">
      <div
        id="initial-loader"
        style="
          display: flex;
          align-items: center;
          justify-content: center;
          height: 100vh;
          font-family: Newsreader, Palatino, serif;
          background: #fbf9f5;
          color: #111111;
        "
      >
        The Daily Score
      </div>
    </div>
    <script>
      (function () {
        function markNativeShell() {
          try {
            var cap = window.Capacitor;
            if (!cap || typeof cap.isNativePlatform !== 'function' || !cap.isNativePlatform()) {
              return false;
            }
            document.documentElement.classList.add('capacitor-native');
            document.documentElement.style.backgroundColor = '#FBF9F5';
            document.body.style.backgroundColor = '#FBF9F5';
            var loader = document.getElementById('initial-loader');
            if (loader) loader.remove();
            return true;
          } catch (e) {
            return false;
          }
        }
        if (!markNativeShell()) {
          document.addEventListener('DOMContentLoaded', markNativeShell);
          window.addEventListener('load', markNativeShell);
        }
      })();
    </script>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
